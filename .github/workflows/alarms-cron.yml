# Avaliador de alarmes para quem está no plano Hobby da Vercel (lá o Cron nativo
# roda no máximo 1x por dia). No plano Pro, prefira o Cron da Vercel (veja o
# README) e desative este workflow.
#
# Com o Upstash Redis configurado, o avaliador não acorda o banco enquanto nada
# muda, então 5 min cabe no plano gratuito do Neon. Sem Redis, use "*/15 * * * *".
#
# Configure em Settings → Secrets and variables → Actions:
#   APP_URL      ex.: https://monitor.seudominio.com.br
#   CRON_SECRET  o mesmo valor configurado na Vercel
name: Avaliar alarmes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar /api/cron/alarms
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL/CRON_SECRET não configurados — nada a fazer."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/alarms"
